[package]
name = "once_type_map"
version = "0.1.1"
edition = "2024"
rust-version = "1.86"
authors = ["Kiril Karaatanasov <karaatanasov@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/noclue/once_type_map"
documentation = "https://docs.rs/once_type_map"
description = "Thread-safe, insert-once type map that hands out plain references (no guards), like a OnceLock keyed by type"
readme = "README.md"
keywords = ["typemap", "extensions", "oncelock", "lazy", "any"]
categories = ["concurrency", "data-structures", "rust-patterns"]

[dependencies]

[dev-dependencies]
once_cell = "1.21.4"
tokio = { version = "1.54", features = ["rt", "macros", "sync", "time"] }
